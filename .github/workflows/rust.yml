name: Rust rewrite

on:
  pull_request:
  push:
    branches: ["release/rust-rewrite-v1"]

defaults:
  run:
    working-directory: rust

jobs:
  # Mechanical check of the rewrite's branch policy (see
  # rust/docs/adr/0004-release-branch-flow.md): every rewrite feature branch
  # merges into release/rust-rewrite-v1, never main/master.
  pr-base-guard:
    name: Rewrite PR base guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check PR base branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "head=$HEAD_REF base=$BASE_REF"
          case "$HEAD_REF" in
            feature/rust-*)
              if [ "$BASE_REF" != "release/rust-rewrite-v1" ]; then
                echo "::error::Rust rewrite branch $HEAD_REF must target release/rust-rewrite-v1, not $BASE_REF"
                exit 1
              fi ;;
          esac
          case "$BASE_REF" in
            main|master)
              if [ "$HEAD_REF" = "release/rust-rewrite-v1" ]; then
                echo "::error::Promoting release/rust-rewrite-v1 to $BASE_REF is a separate human decision outside the rewrite plan"
                exit 1
              fi ;;
          esac

  rust-checks:
    name: Rust fmt/clippy/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # RUST-07: the pinned ocrs models (not bundled) so OCR tests always
      # run in CI; digests match ragmonk-convert's OCR_MODEL_MANIFEST.
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ocr-models
          key: ocrs-models-f15cfb56-e484866d
      - name: Fetch OCR models
        shell: bash
        env:
          DIR: ${{ runner.temp }}/ocr-models
        run: |
          mkdir -p "$DIR"
          fetch() {
            [ -f "$DIR/$1" ] || curl -sSfL --retry 4 -o "$DIR/$1" "https://ocrs-models.s3-accelerate.amazonaws.com/$1"
            if command -v sha256sum >/dev/null; then
              echo "$2  $DIR/$1" | sha256sum -c -
            else
              echo "$2  $DIR/$1" | shasum -a 256 -c -
            fi
          }
          fetch text-detection.rten f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca
          fetch text-recognition.rten e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e
      # RUST-09: the pinned embedding and reranker models (revision + sha256
      # match ragmonk-ml's manifest) so parity and finalizer tests run.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-minilm-1110a243-msmarco-233902d2
      - name: Fetch embedding models
        shell: bash
        env:
          DIR: ${{ runner.temp }}/models/all-minilm-l6-v2
          BASE: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
        run: |
          mkdir -p "$DIR"
          fetch() {
            [ -f "$DIR/$1" ] || curl -sSfL --retry 4 -o "$DIR/$1" "$BASE/$1"
            if command -v sha256sum >/dev/null; then
              echo "$2  $DIR/$1" | sha256sum -c -
            else
              echo "$2  $DIR/$1" | shasum -a 256 -c -
            fi
          }
          fetch config.json 953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41
          fetch model.safetensors 53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db
          fetch tokenizer.json be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037
          DIR="${{ runner.temp }}/models/ms-marco-minilm-l6-v2"
          BASE=https://huggingface.co/cross-encoder/ms-marco-MiniLM-L-6-v2/resolve/233902d25c440f23af6f7d6e94d2946bac0bee0a
          mkdir -p "$DIR"
          fetch config.json 380e02c93f431831be65d99a4e7e5f67c133985bf2e77d9d4eba46847190bacc
          fetch model.safetensors 821d1aa69520101d6e0737f78a042ae25b19e5cb9160701909d10434f4aeb0ae
          fetch tokenizer.json d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
        env:
          RAGMONK_OCR_MODELS_DIR: ${{ runner.temp }}/ocr-models
          RAGMONK_REQUIRE_OCR: "1"
          RAGMONK_MODELS_DIR: ${{ runner.temp }}/models
          RAGMONK_REQUIRE_MODELS: "1"
      - name: cargo build --release
        run: cargo build --workspace --release

  # RUST-03: V2 schema lifecycle against real clusters (legacy cleanup,
  # init, invisible-until-publish, crash/abort/GC, bounded bulk, build mode).
  server-v2-integration:
    name: Rust V2 server integration (OpenSearch + Elasticsearch)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9202:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      RAGMONK_TEST_OPENSEARCH_URL: http://localhost:9201
      RAGMONK_TEST_ELASTICSEARCH_URL: http://localhost:9202
      RAGMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Wait for clusters
        working-directory: .
        run: |
          for url in "$RAGMONK_TEST_OPENSEARCH_URL" "$RAGMONK_TEST_ELASTICSEARCH_URL"; do
            for i in $(seq 1 60); do
              curl -fs "$url/_cluster/health?wait_for_status=yellow&timeout=5s" && break
              sleep 5
            done
          done
      - name: Live V2 lifecycle tests
        run: cargo test -p ragmonk-backends --test live -- --nocapture

  # RUST-00 verification gate: capture the Python reference twice through
  # the compat harness and prove the canonical output is identical.
  compat-baseline:
    name: Python reference stability (compat harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install CPU-only torch
        working-directory: .
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python reference
        working-directory: .
        run: pip install -e ".[dev]"
      - name: Build harness
        run: cargo build -p ragmonk-compat -p ragmonk-cli
      - name: Capture Python reference twice and compare
        working-directory: .
        run: >
          rust/target/debug/ragmonk-compat stability --impl python
          --program "$(command -v ragmonk)" --runs 3
          --out "$RUNNER_TEMP/python-capture.json"
      # Informational: dependency ranges in pyproject.toml are not locked, so
      # a fresh resolution can legitimately drift from the committed baseline.
      - name: Compare with committed baseline (informational)
        working-directory: .
        continue-on-error: true
        run: >
          rust/target/debug/ragmonk-compat compare
          rust/compat/baseline/python-1e92ed4.json "$RUNNER_TEMP/python-capture.json"
      - name: Rust candidate phase gate
        working-directory: .
        run: |
          rust/target/debug/ragmonk-compat capture --impl rust --program rust/target/debug/ragmonk \
            --out "$RUNNER_TEMP/rust-capture.json"
          rust/target/debug/ragmonk-compat gate "$RUNNER_TEMP/python-capture.json" \
            "$RUNNER_TEMP/rust-capture.json" --phase "$RUST_PHASE"
        env:
          # Highest merged rewrite phase; every manifest step it (or an
          # earlier phase) owns must match the Python reference.
          RUST_PHASE: RUST-12
      # Informational: the RUST-01 golden fixtures must still reflect the
      # Python reference (pydantic/PyYAML are not locked, so drift is
      # reported rather than failing the job).
      - name: Golden fixtures are current (informational)
        working-directory: .
        continue-on-error: true
        run: |
          python rust/compat/tools/gen_core_golden.py
          python rust/compat/tools/gen_code_golden.py
          python rust/compat/tools/gen_document_golden.py
          python rust/compat/tools/gen_docling_golden.py
          python rust/compat/tools/gen_email_golden.py
          python rust/compat/tools/gen_link_golden.py
          git diff --exit-code -- rust/compat/golden
