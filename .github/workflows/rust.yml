name: CI

on:
  pull_request:
  push:
    branches: ["main", "release/ragmonk-1.0-clean-slate"]

jobs:
  # The former product name must not come back, and RagMonk 1.0 stays
  # fresh-install/fresh-index only (ADR 0032): the clean-slate baseline
  # only shrinks.
  repository-audits:
    name: Repository audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask branding-audit
      - run: cargo xtask clean-slate-audit

  rust-checks:
    name: Rust fmt/clippy/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The pinned ocrs models (not bundled) so OCR tests always
      # run in CI; digests match ragmonk-convert's OCR_MODEL_MANIFEST.
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ocr-models
          key: ocrs-models-f15cfb56-e484866d
      - name: Fetch OCR models
        shell: bash
        env:
          DIR: ${{ runner.temp }}/ocr-models
        run: |
          mkdir -p "$DIR"
          fetch() {
            [ -f "$DIR/$1" ] || curl -sSfL --retry 4 -o "$DIR/$1" "https://ocrs-models.s3-accelerate.amazonaws.com/$1"
            if command -v sha256sum >/dev/null; then
              echo "$2  $DIR/$1" | sha256sum -c -
            else
              echo "$2  $DIR/$1" | shasum -a 256 -c -
            fi
          }
          fetch text-detection.rten f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca
          fetch text-recognition.rten e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e
      # The pinned embedding and reranker models (revision + sha256
      # match ragmonk-ml's manifest) so parity and finalizer tests run.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-minilm-1110a243-msmarco-233902d2
      - name: Fetch embedding models
        shell: bash
        env:
          DIR: ${{ runner.temp }}/models/all-minilm-l6-v2
          BASE: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
        run: |
          mkdir -p "$DIR"
          fetch() {
            [ -f "$DIR/$1" ] || curl -sSfL --retry 4 -o "$DIR/$1" "$BASE/$1"
            if command -v sha256sum >/dev/null; then
              echo "$2  $DIR/$1" | sha256sum -c -
            else
              echo "$2  $DIR/$1" | shasum -a 256 -c -
            fi
          }
          fetch config.json 953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41
          fetch model.safetensors 53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db
          fetch tokenizer.json be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037
          DIR="${{ runner.temp }}/models/ms-marco-minilm-l6-v2"
          BASE=https://huggingface.co/cross-encoder/ms-marco-MiniLM-L-6-v2/resolve/233902d25c440f23af6f7d6e94d2946bac0bee0a
          mkdir -p "$DIR"
          fetch config.json 380e02c93f431831be65d99a4e7e5f67c133985bf2e77d9d4eba46847190bacc
          fetch model.safetensors 821d1aa69520101d6e0737f78a042ae25b19e5cb9160701909d10434f4aeb0ae
          fetch tokenizer.json d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
        env:
          RAGMONK_OCR_MODELS_DIR: ${{ runner.temp }}/ocr-models
          RAGMONK_REQUIRE_OCR: "1"
          RAGMONK_MODELS_DIR: ${{ runner.temp }}/models
          RAGMONK_REQUIRE_MODELS: "1"
      - name: cargo build --release
        run: cargo build --workspace --release

  # Server index lifecycle against real, empty clusters: foreign-index
  # refusal, init, invisible-until-publish, crash/abort/GC, bounded bulk,
  # build mode, catalog paging past 10000 sources, lease fencing and k-NN;
  # then server mode end to end through the service layer.
  server-integration:
    name: Server integration (OpenSearch + Elasticsearch)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9202:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      RAGMONK_TEST_OPENSEARCH_URL: http://localhost:9201
      RAGMONK_TEST_ELASTICSEARCH_URL: http://localhost:9202
      RAGMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Wait for clusters
        run: |
          for url in "$RAGMONK_TEST_OPENSEARCH_URL" "$RAGMONK_TEST_ELASTICSEARCH_URL"; do
            for i in $(seq 1 60); do
              curl -fs "$url/_cluster/health?wait_for_status=yellow&timeout=5s" && break
              sleep 5
            done
          done
      - name: Live server lifecycle tests
        run: cargo test -p ragmonk-backends --test live -- --nocapture
      # Server mode end to end (ADR 0033): catalog, staged indexing with
      # copy-forward, queries, status, links, leases, offline safety and
      # the no-local-fallback guarantee, on both engines.
      - name: Server mode end-to-end tests
        run: cargo test -p ragmonk-service --test server_live -- --nocapture
      # Status (ADR 0034) on both engines: 150 sources in <= 30 requests,
      # a watch refresh in < 10, pending builds invisible, global error
      # order, two-host run visibility, fencing and expired leases; the
      # CLI in server mode never reads the home's SQLite.
      - name: Status live tests
        run: |
          cargo test -p ragmonk-status --test live_server -- --nocapture
          cargo test -p ragmonk-cli --test status -- --nocapture
      - name: Status benchmark (150 sources, both engines)
        run: cargo test --release -p ragmonk-status --test live_server -- --ignored --nocapture
      # Status (ADR 0034) on both engines: 150 sources in <= 30 requests,
      # a watch refresh in < 10, pending builds invisible, global error
      # order, two-host run visibility, fencing and expired leases; the
      # CLI in server mode never reads the home's SQLite.
      - name: Status live tests
        run: |
          cargo test -p ragmonk-status --test live_server -- --nocapture
          cargo test -p ragmonk-cli --test status -- --nocapture

  # The native installers end to end, against release archives
  # packaged from this commit's build and served from a local directory
  # (RAGMONK_DOWNLOAD_BASE): install, re-install a second version, then
  # `ragmonk update rollback` back to the first.
  install-script-tests:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # runner.temp is not available in job-level env.
      - name: Paths
        run: |
          for kv in DIST=dist RAGMONK_DOWNLOAD_BASE=dist RAGMONK_INSTALL_DIR=ragmonk-install \
                    RAGMONK_BIN_DIR=ragmonk-bin RAGMONK_HOME=ragmonk-home; do
            echo "${kv%%=*}=$RUNNER_TEMP/${kv#*=}" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build and package two versions
        run: |
          cargo build -p ragmonk-cli
          for v in 0.9.0 0.9.1; do
            cargo xtask package --binary target/debug/ragmonk \
              --version "$v" --target "${{ matrix.target }}" --out "$DIST"
          done
          cat "$DIST/SHA256SUMS"
      - name: Install 0.9.0
        run: RAGMONK_VERSION=0.9.0 sh ./install.sh
      - name: Verify the installed CLI works
        run: |
          "$RAGMONK_BIN_DIR/ragmonk" version
          "$RAGMONK_BIN_DIR/ragmonk" doctor
          grep -q '"install_method": "native"' "$RAGMONK_HOME/install_info.json"
      - name: A tampered archive is refused
        run: |
          cp -R "$DIST" "$RUNNER_TEMP/bad" && echo x >> "$RUNNER_TEMP/bad/ragmonk-0.9.1-${{ matrix.target }}.tar.gz"
          if RAGMONK_VERSION=0.9.1 RAGMONK_DOWNLOAD_BASE="$RUNNER_TEMP/bad" sh ./install.sh; then exit 1; fi
          test "$(readlink "$RAGMONK_INSTALL_DIR/current")" = "versions/0.9.0"
      - name: Install 0.9.1, then roll back
        run: |
          RAGMONK_VERSION=0.9.1 sh ./install.sh
          test "$(readlink "$RAGMONK_INSTALL_DIR/current")" = "versions/0.9.1"
          "$RAGMONK_BIN_DIR/ragmonk" update rollback
          test "$(readlink "$RAGMONK_INSTALL_DIR/current")" = "versions/0.9.0"
          "$RAGMONK_BIN_DIR/ragmonk" version

  install-script-tests-windows:
    name: Install script (windows-latest)
    runs-on: windows-latest
    steps:
      # runner.temp is not available in job-level env.
      - name: Paths
        run: |
          $t = $env:RUNNER_TEMP
          @("DIST=$t\dist", "RAGMONK_DOWNLOAD_BASE=$t\dist", "RAGMONK_INSTALL_DIR=$t\ragmonk-install",
            "RAGMONK_BIN_DIR=$t\ragmonk-bin", "RAGMONK_HOME=$t\ragmonk-home") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build and package two versions
        run: |
          cargo build -p ragmonk-cli
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          foreach ($v in "0.9.0", "0.9.1") {
            cargo xtask package --binary target/debug/ragmonk.exe `
              --version $v --target x86_64-pc-windows-msvc --out $env:DIST
            if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          }
      - name: Install 0.9.0
        run: |
          $env:RAGMONK_VERSION = "0.9.0"
          ./install.ps1
      - name: Verify the installed CLI works
        run: |
          & "$env:RAGMONK_BIN_DIR\ragmonk.cmd" version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          & "$env:RAGMONK_BIN_DIR\ragmonk.cmd" doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          $info = Get-Content "$env:RAGMONK_HOME\install_info.json" -Raw | ConvertFrom-Json
          if ($info.install_method -ne "native") { throw "unexpected install_method: $($info.install_method)" }
      # Windows cannot overwrite a running exe: re-installing while the
      # daemon runs from bin\ragmonk.exe proves the rename-based swap.
      - name: Install 0.9.1 while the daemon holds the current exe, then roll back
        run: |
          & "$env:RAGMONK_BIN_DIR\ragmonk.cmd" daemon start
          if ($LASTEXITCODE -ne 0) { throw "daemon start failed" }
          try {
            $env:RAGMONK_VERSION = "0.9.1"
            ./install.ps1
          } finally {
            & "$env:RAGMONK_BIN_DIR\ragmonk.cmd" daemon stop
          }
          if ((Get-Content "$env:RAGMONK_INSTALL_DIR\current" -Raw).Trim() -ne "0.9.1") { throw "not switched" }
          & "$env:RAGMONK_BIN_DIR\ragmonk.cmd" update rollback
          if ($LASTEXITCODE -ne 0) { throw "rollback failed" }
          if ((Get-Content "$env:RAGMONK_INSTALL_DIR\current" -Raw).Trim() -ne "0.9.0") { throw "not rolled back" }
          & "$env:RAGMONK_BIN_DIR\ragmonk.cmd" version
          if ($LASTEXITCODE -ne 0) { throw "version failed after rollback" }

  # The release image builds (amd64; arm64 builds natively in
  # rust-release.yml), runs from an empty home and ships no interpreter.
  container-image:
    name: Container image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: RAGMONK_VERSION=0.9.0
          tags: ragmonk:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm ragmonk:ci version --json | grep -q '"0.9.0"'
          # clean-slate-audit: allow-start (asserts the image has no interpreter)
          docker run --rm --entrypoint sh ragmonk:ci -c '! command -v python3 && ! command -v python'
          # clean-slate-audit: allow-end
          docker run --rm --entrypoint sh ragmonk:ci -c 'ragmonk init && ragmonk doctor'
          test -n "$(docker run --rm --entrypoint ls ragmonk:ci /opt/ragmonk/models/all-minilm-l6-v2/model.safetensors)"
