name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast, dependency-free gate: fail the build if any old pre-rename
  # product identifier survives outside the narrow historical/clean-break
  # allowlist (see scripts/check_branding.py). Needs only Python + git, so
  # it skips the heavy torch/docling install the other jobs pay.
  branding-audit:
    name: Branding audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for disallowed old identifiers
        run: python scripts/check_branding.py

  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history/tags, not the default shallow clone -- this
          # project's version is now git-tag-derived (hatch-vcs; see
          # pyproject.toml's [tool.hatch.version]), and a shallow clone
          # can't compute a meaningful "N commits since the last tag"
          # dev version. Not required for correctness here (nothing in
          # this job depends on the exact version string), but keeps
          # what `pip install -e ".[dev]"` reports consistent with a
          # real local checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Docling pulls in torch as a base dependency (for PDF layout/table
      # structure models). PyPI's default Linux torch wheel bundles CUDA
      # (several GB of nvidia-* packages neither this CI nor Phase 3's
      # OCR-off, GPU-free pipeline needs) -- installing the CPU-only build
      # first so torch's own resolution is already satisfied keeps this
      # job's install size and time reasonable. macOS/Windows PyPI wheels
      # are CPU-only already, so this is Linux-only. torchvision must come
      # from the SAME index in the SAME command: resolving it separately
      # (e.g. later, from default PyPI, as a transitive dependency) can
      # pick a torchvision build compiled against a different torch build
      # than the one just installed, which fails at import time with
      # "operator torchvision::nms does not exist".
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/ragmonk

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # see lint-and-typecheck's own checkout step for why
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        if: matrix.os == 'ubuntu-latest'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest
        # docling_pdf-marked tests are excluded by default (see
        # pyproject.toml's addopts) -- they exercise Docling's real PDF
        # pipeline, which downloads model weights on first use, and must
        # not gate this job's pass/fail. See the docling-pdf-tests job
        # below for that coverage, run non-blocking.
        run: pytest -q

  # Completion plan F8: REAL server-backend acceptance, one job per
  # engine. Each starts a genuine single-node cluster as a service
  # container, installs the matching optional client extra, and runs every
  # `<engine>_integration`-marked test: the adapter-level integration tests
  # plus the full CLI acceptance flow in
  # tests/integration/test_server_acceptance_live.py (init with real engine
  # validation, source add, index, lexical search, symbol/callers/callees/
  # references/impact/explore, incremental add/modify/delete/rename,
  # outage handling, failed-rebuild preservation, atomic rebuild,
  # doctor/status, source remove). RAGMONK_REQUIRE_LIVE_SERVER=1 turns
  # "cluster unreachable" into a FAILURE instead of a silent skip. These
  # jobs are blocking, including the semantic/hybrid search step (needs
  # the embedding model download, which is cached across runs to reduce
  # flakiness). Normal local CI above is unchanged; Docker is only used by
  # CI, never required at runtime.
  opensearch-acceptance:
    name: OpenSearch server acceptance
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "RagMonk-CI-only-1!"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      OPENSEARCH_URL: http://localhost:9200
      RAGMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project with the OpenSearch extra
        run: pip install -e ".[dev,opensearch]"
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 60); do
            curl -fs "$OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=5s" && exit 0
            sleep 5
          done
          echo "OpenSearch did not become healthy" >&2
          exit 1
      - name: Pytest (opensearch_integration, full server acceptance)
        run: pytest -m opensearch_integration -q -rs
      - name: Cache embedding model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-hf-${{ runner.os }}
      - name: Semantic/hybrid acceptance (downloads embedding model)
        env:
          RAGMONK_ACCEPTANCE_SEMANTIC: "1"
        run: pytest -m opensearch_integration -q -rs tests/integration/test_server_acceptance_live.py -k semantic

  elasticsearch-acceptance:
    name: Elasticsearch server acceptance
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      RAGMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project with the Elasticsearch extra
        run: pip install -e ".[dev,elasticsearch]"
      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            curl -fs "$ELASTICSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=5s" && exit 0
            sleep 5
          done
          echo "Elasticsearch did not become healthy" >&2
          exit 1
      - name: Pytest (elasticsearch_integration, full server acceptance)
        run: pytest -m elasticsearch_integration -q -rs
      - name: Cache embedding model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-hf-${{ runner.os }}
      - name: Semantic/hybrid acceptance (downloads embedding model)
        env:
          RAGMONK_ACCEPTANCE_SEMANTIC: "1"
        run: pytest -m elasticsearch_integration -q -rs tests/integration/test_server_acceptance_live.py -k semantic

  # Optional, non-blocking: actually runs Docling's PDF conversion (model
  # download from Hugging Face included). Kept separate from `test` above
  # so a slow/unavailable model download never gates a merge -- see
  # CONTRIBUTING.md for the same command run locally.
  docling-pdf-tests:
    name: Docling PDF tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Cache Docling/Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-hf-models-${{ runner.os }}
      - name: Pytest (docling_pdf)
        run: pytest -m docling_pdf -q

  # Optional, non-blocking: spawns and signals a real, detached
  # `ragmonk daemon` process (Phase 7). Kept separate from `test` above
  # so process-startup/signal-delivery timing on a given runner never
  # gates a merge -- the daemon loop itself is already covered by `test`
  # above via direct, process-free unit/integration tests. See
  # CONTRIBUTING.md for the same command run locally.
  daemon-subprocess-tests:
    name: Daemon subprocess tests (non-blocking)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        if: matrix.os == 'ubuntu-latest'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest (daemon_subprocess)
        run: pytest -m daemon_subprocess -q

  # Optional, non-blocking: actually loads Phase 9's real local embedding
  # model (Hugging Face weight download included). Kept separate from
  # `test` above so a slow/unavailable model download never gates a
  # merge -- same rationale and pattern as `docling-pdf-tests` above; see
  # CONTRIBUTING.md for the same command run locally.
  embedding-model-tests:
    name: Embedding model tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Cache embedding model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-hf-${{ runner.os }}
      - name: Pytest (embedding_model)
        run: pytest -m embedding_model -q

  # Optional, non-blocking: actually loads Phase 11's real local
  # cross-encoder reranker model (Hugging Face weight download included).
  # Kept separate from `test` above for the same reason as
  # `embedding-model-tests`: a slow/unavailable model download never
  # gates a merge. Phase 11 itself is optional and off by default
  # (search.reranker.enabled=false) -- see CONTRIBUTING.md for the same
  # command run locally.
  reranker-model-tests:
    name: Reranker model tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Cache reranker model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: reranker-model-hf-${{ runner.os }}
      - name: Pytest (reranker_model)
        run: pytest -m reranker_model -q

  # Optional, non-blocking: generates a synthetic search corpus and
  # measures real query latency (benchmarks/search/), printing a report.
  # Non-blocking because its numbers are only meaningful on real,
  # unshared hardware (see benchmarks/search/targets.py) -- a busy CI
  # runner missing the blueprint's millisecond targets is not a
  # regression signal, so this job never hard-fails on that; it does
  # still fail if the pipeline itself breaks (an exception, or a known
  # fixture that stops being found). See CONTRIBUTING.md for the same
  # command run locally, including larger corpus sizes.
  benchmark-search-tests:
    name: Search benchmark suite (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest (benchmark_search)
        run: pytest -m benchmark_search -q -s

  # Optional, non-blocking: measures subprocess wall-clock startup for the
  # lightweight commands (benchmarks/cli_startup/) and prints a latency
  # report. Non-blocking for the same reason benchmark-search-tests is:
  # its numbers are only meaningful on real, unshared hardware, so a busy
  # CI runner missing a target is not a regression signal. The always-on,
  # hard-gating regression check for CLI startup is the architectural
  # import test in the `test` job above (tests/unit/test_cli_startup_imports.py).
  cli-startup-benchmark-tests:
    name: CLI startup benchmark (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest (cli_startup_benchmark)
        run: pytest -m cli_startup_benchmark -q -s

  # Optional, non-blocking: runs install.sh/install.ps1 exactly as a real
  # user would (curl/irm into a shell), pointed at *this* branch/commit via
  # RAGMONK_REF, and verifies the resulting `ragmonk` launcher actually
  # works. Non-blocking because it repeats the same heavy dependency
  # download (torch, docling) as the jobs above, on top of a real network
  # fetch of the branch tarball/zipball from GitHub -- see CONTRIBUTING.md
  # for the same commands run locally.
  install-script-tests:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.sh against this branch
        env:
          RAGMONK_REF: ${{ github.head_ref || github.ref_name }}
          RAGMONK_INSTALL_DIR: ${{ runner.temp }}/ragmonk-install
          RAGMONK_BIN_DIR: ${{ runner.temp }}/ragmonk-bin
          RAGMONK_HOME: ${{ runner.temp }}/ragmonk-home
        run: sh ./install.sh
      - name: Verify the installed CLI works
        env:
          RAGMONK_HOME: ${{ runner.temp }}/ragmonk-home
        run: |
          "${{ runner.temp }}/ragmonk-bin/ragmonk" version
          "${{ runner.temp }}/ragmonk-bin/ragmonk" doctor
      - name: Verify install-script metadata was written (update/installer.py detection)
        run: |
          test -f "${{ runner.temp }}/ragmonk-home/install_info.json"
          grep -q '"install_method": "install-script"' "${{ runner.temp }}/ragmonk-home/install_info.json"

  install-script-tests-windows:
    name: Install script (windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.ps1 against this branch
        env:
          RAGMONK_REF: ${{ github.head_ref || github.ref_name }}
          RAGMONK_INSTALL_DIR: ${{ runner.temp }}\ragmonk-install
          RAGMONK_BIN_DIR: ${{ runner.temp }}\ragmonk-bin
          RAGMONK_HOME: ${{ runner.temp }}\ragmonk-home
        run: ./install.ps1
      - name: Verify the installed CLI works
        env:
          RAGMONK_HOME: ${{ runner.temp }}\ragmonk-home
        run: |
          & "${{ runner.temp }}\ragmonk-bin\ragmonk.cmd" version
          & "${{ runner.temp }}\ragmonk-bin\ragmonk.cmd" doctor
      - name: Verify install-script metadata was written (update/installer.py detection)
        run: |
          $infoPath = "${{ runner.temp }}\ragmonk-home\install_info.json"
          if (-not (Test-Path $infoPath)) { throw "missing $infoPath" }
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          if ($info.install_method -ne "install-script") { throw "unexpected install_method: $($info.install_method)" }
      # Regression test for the Windows self-upgrade bug `ragmonk update
      # install` hits: it re-runs this same install.ps1 from inside the
      # currently-running venv\Scripts\ragmonk.exe. `ragmonk daemon
      # start` spawns a real, detached background process from that exact
      # venv (python.exe, per service loop `cli/daemon.py`'s `_spawn`)
      # and waits for it to report healthy before returning -- a
      # genuinely-executing process, not a synthetic file lock (an
      # earlier version of this test used
      # `[System.IO.File]::Open(..., FileShare.Read)`, which is *more*
      # restrictive than what Windows actually grants a running PE image
      # and produced a false failure here). Re-running install.ps1 while
      # that daemon is alive and confirming both the run and the
      # resulting CLI still work is the real proof that the rename-based
      # swap in install.ps1 doesn't need the venv's files to be free.
      - name: Re-run install.ps1 while a real background process holds the venv open (self-upgrade simulation)
        env:
          RAGMONK_REF: ${{ github.head_ref || github.ref_name }}
          RAGMONK_INSTALL_DIR: ${{ runner.temp }}\ragmonk-install
          RAGMONK_BIN_DIR: ${{ runner.temp }}\ragmonk-bin
          RAGMONK_HOME: ${{ runner.temp }}\ragmonk-home
        run: |
          & "${{ runner.temp }}\ragmonk-bin\ragmonk.cmd" daemon start
          if ($LASTEXITCODE -ne 0) { throw "daemon start failed" }
          try {
              ./install.ps1
          } finally {
              & "${{ runner.temp }}\ragmonk-bin\ragmonk.cmd" daemon stop
          }
      - name: Verify the installed CLI still works after the locked re-run
        env:
          RAGMONK_HOME: ${{ runner.temp }}\ragmonk-home
        run: |
          & "${{ runner.temp }}\ragmonk-bin\ragmonk.cmd" version
          & "${{ runner.temp }}\ragmonk-bin\ragmonk.cmd" doctor
