[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ragmonk"
dynamic = ["version"]
description = "Local-first knowledge compiler and retrieval engine CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "RagMonk" }]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    # Exact Tokenizer plan, Phase 1: the Rust ``tokenizers`` library is a
    # DIRECT, first-party dependency -- ``ragmonk.tokenization.model_tokenizer``
    # loads the bundled ``tokenizer.json`` through it to count exact tokens
    # for chunk budgeting. Although docling/transformers already pull
    # ``tokenizers`` in transitively, the plan requires a declared, tested
    # range here rather than relying on that transitive edge (so a future
    # docling that drops or re-pins it can't silently break chunking). It
    # loads local files only -- no network, no torch, no transformers.
    "tokenizers>=0.19,<1",
    "tree-sitter>=0.24,<0.27",
    "tree-sitter-language-pack>=1.17,<2",
    # Plain "docling" only -- its VLM/ASR/XBRL extras (ocrmac,
    # remote-serving, tesserocr, vlm, xbrl, asr) are deliberately not
    # added; Phase 3 wires up PDF/DOCX/PPTX/XLSX/HTML/Markdown/TXT/EML
    # only. Docling's own base install still pulls in torch +
    # layout/table-structure model packages for PDF -- unavoidable, see
    # docs/CHANGELOG and documents/docling_adapter.py. As of the pinned
    # range's current resolution, plain "docling" itself already
    # transitively depends on "docling-slim[standard]", which in turn
    # pulls in RapidOCR -- so, unlike when this comment was first written,
    # Search Quality Improvement Plan Phase 5's OCR fallback
    # (documents/docling_adapter.py, gated by documents.ocr) needs no
    # extra dependency added here at all. This is an upstream Docling
    # packaging detail, not something this project chose or can rely on
    # holding for every version in this range -- docling_adapter.py's OCR
    # path still degrades gracefully (skips OCR, keeps the plain
    # conversion) if a future resolution ever lacks a usable OCR engine.
    "docling>=2.40,<3",
    # Search Quality Improvement Plan, Phase 10: Docling's own ODT/ODS/ODP
    # backend (documents/docling_adapter.py) imports this behind a guarded
    # try/except -- unlike RapidOCR (Phase 5) and mail-parser/python-oxmsg
    # (EML/MSG), it is genuinely *not* pulled in transitively by plain
    # "docling" at this pinned range's current resolution, so it is added
    # explicitly here. It earns an exception to this project's stated
    # "avoid heavy/optional Docling extras" policy above: pure Python,
    # its own only dependency is the already-required "lxml" (plus
    # typing-extensions, already required transitively) -- no ML model
    # weights, no subprocess, no system binary. Same weight class as the
    # dev-only python-docx/python-pptx/openpyxl below, just needed at
    # runtime (to actually convert a project's .odt/.ods/.odp files, not
    # only to generate test fixtures).
    "odfdo>=3.1,<4",
    # Official MCP Python SDK. Pinned below 2.x: the 2.x line renamed
    # ``mcp.server.fastmcp.FastMCP`` to ``mcp.server.mcpserver.MCPServer``
    # and reshuffled several APIs (see its own import-time migration
    # error) -- ``mcp/server.py`` targets the well-established 1.x
    # ``FastMCP`` decorator API.
    "mcp>=1.2,<2",
    # Native OS filesystem-event watching (inotify/FSEvents/
    # ReadDirectoryChangesW) for Phase 7's local-source watcher -- small,
    # pure-Python-with-native-backends, no heavy transitive deps (unlike
    # docling's torch pull above).
    "watchdog>=4,<7",
    # Phase 9: local sentence embeddings (retrieval/embedder.py) run
    # directly through `transformers`'s AutoTokenizer/AutoModel rather
    # than adding the `sentence-transformers` package -- both `torch` and
    # `transformers` are already required transitively via Docling's own
    # PDF pipeline (see documents/docling_adapter.py), so this is a
    # version-pin declaration of an already-present dependency, not new
    # footprint; `sentence-transformers` itself would additionally pull
    # in scikit-learn/scipy/Pillow/tqdm for what is, for one fixed model,
    # ~15 lines of mean-pooling. See retrieval/embedder.py's docstring.
    # Search Quality Improvement Plan, Phase 11 (optional, off by default)
    # reuses this same dependency for its cross-encoder reranker
    # (retrieval/neural_reranker.py, AutoModelForSequenceClassification) --
    # no new package, same "already-present, just one more fixed model"
    # rationale.
    "transformers>=4.40",
    # Phase 9: real OpenAI/Anthropic API clients (ai/openai.py,
    # ai/anthropic.py). Pinned below each SDK's newer major version:
    # both switched, at the time of writing, to a much newer, internally
    # forked HTTP client that this project's provider modules were not
    # written or tested against -- the pinned ranges are each package's
    # well-documented, `httpx`-based surface, which is also what makes
    # dependency-injecting a mock `httpx.Client` for tests reliable (see
    # ai/openai.py's docstring).
    "openai>=1.0,<2",
    "anthropic>=0.25,<1",
    # Phase 9: ai/ollama.py's local HTTP client, and every provider
    # module's `http_client` test-injection seam. Already a transitive
    # dependency (via `mcp`); declared explicitly since first-party code
    # now imports it directly.
    "httpx>=0.27",
    # CLI performance improvement plan, Phase 6: update/versioning.py's
    # PEP 440 comparison between an untrusted release tag and the
    # installed version -- which, for an editable/unreleased build (this
    # project's own pyproject.toml now derives __version__ from git tags
    # via hatch-vcs), is itself a PEP 440 dev version rather than a plain
    # MAJOR.MINOR.PATCH string. Already a transitive dependency (via
    # hatchling/pip themselves); declared explicitly since first-party
    # code now imports it directly.
    "packaging>=24",
    # Search performance redesign: retrieval/ann.py's production ANN
    # backend (HNSW), replacing brute-force cosine similarity over every
    # current-model embedding as the default semantic-search path. Pure
    # local library, no server, persistent on-disk index -- matches this
    # project's local-first design the way a loadable SQLite extension
    # (e.g. sqlite-vec) could not guarantee across every supported
    # platform/Python build (see retrieval/vectorstore.py's own
    # docstring for that same cross-platform concern). Never a hard
    # requirement for semantic search to function: retrieval/ann.py
    # falls back to the pure-Python brute-force scan on any import or
    # native-load failure, so a broken install degrades rather than
    # crashes.
    "usearch>=2.16,<3",
    # Admin UI plan, Phase 1: the built-in local administration web
    # interface (`ragmonk ui`). FastAPI + Starlette provide the ASGI app
    # and routing, Uvicorn the local server, Jinja2 the server-rendered
    # templates, and python-multipart lets Starlette parse the HTML form
    # POSTs the admin screens submit. HTMX is vendored as a static asset
    # under src/ragmonk/ui/static/js/ (no CDN, no Node.js, works offline)
    # rather than pulled from PyPI. All four are pure-Python with light
    # transitive footprints and are only imported when `ragmonk ui`
    # actually runs -- every other command path never touches them.
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Subscription plan, Phase 3: the official GitHub Copilot Python SDK, an
# OPTIONAL runtime for the beta ``github_copilot`` provider. It is not a
# default dependency -- RagMonk indexes and retrieves without it, and the
# adapter reports a clear "runtime unavailable" error when it is absent, so
# only a user who opts into that provider installs it
# (``pip install "ragmonk[copilot]"``). The exact distribution name/version
# range must be confirmed against the pinned SDK before this provider
# leaves beta (see docs/providers/subscription-integration-note.md).
copilot = [
    "github-copilot-sdk>=0.1,<1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    # Dev/test-only: generate .docx/.pptx/.xlsx fixtures in
    # tests/fixtures/documents/. Already pulled in transitively by
    # docling's standard install; declared explicitly here since tests
    # import them directly.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[project.scripts]
ragmonk = "ragmonk.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmonk"]
# Exact Tokenizer plan, Phase 1: the bundled tokenizer assets are
# non-Python data files under the package. They are git-tracked so
# hatchling's default VCS-based file selection already ships them, but
# they are declared here explicitly too -- indexing hard-fails without
# them (see ragmonk.tokenization.model_tokenizer), so their packaging is
# not something to leave to an implicit default.
artifacts = [
    "src/ragmonk/tokenization/assets/**/*",
    # Admin UI plan, Phase 1 (§4.8 Packaging): the Jinja templates and
    # static assets (vendored HTMX, CSS) `ragmonk ui` serves are non-Python
    # data files. They are git-tracked so hatchling's default VCS file
    # selection already ships them, but declared here explicitly too --
    # the UI cannot render a single page without them, so their inclusion
    # in wheels/sdists must not be left to an implicit default.
    "src/ragmonk/ui/templates/**/*",
    "src/ragmonk/ui/static/**/*",
]

# CLI performance improvement plan, Phase 6: one source of truth for the
# version -- an immutable git tag (v0.1.8, ...) -- instead of a value
# duplicated by hand across this file and src/ragmonk/__init__.py. This
# writes src/ragmonk/_version.py (gitignored, generated) at build/install
# time; __init__.py imports __version__ from it.
[tool.hatch.version]
source = "vcs"
# Installing from a plain source tarball/zipball (install.sh/install.ps1's
# own `curl`/`Invoke-WebRequest` download of a branch archive) has no
# `.git` directory at all -- setuptools-scm (which hatch-vcs wraps) can't
# detect a version there and would otherwise hard-fail the whole install.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# This repository's history includes an early tag that predates the
# "v*.*.*" tagging convention (it does not match "v0.1.0") and still
# exists alongside real "v*.*.*" tags going forward. setuptools-scm's own tag
# selection (via `git describe`) picks the *nearest* tag unconditionally
# and only *then* tries to parse it -- an unparseable nearest tag is a
# hard error, not a "keep looking" -- so `--match` here excludes it from
# ever being selected in the first place, rather than trying (and
# failing) to make tag-pattern/tag_regex parse it after the fact.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*.*.*"]

[tool.hatch.build.hooks.vcs]
version-file = "src/ragmonk/_version.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Hand-written parser golden fixtures, not application code: they
# deliberately contain things like an undefined `app` decorator target to
# exercise framework_rules detection, and shouldn't be linted as ours.
extend-exclude = ["tests/fixtures/languages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `tests/` import the top-level `benchmarks` package (a sibling of
# `src/`, not installed with the project -- see benchmarks/search's own
# docstring) without needing its own packaging/install step.
pythonpath = ["."]
# docling_pdf: exercises Docling's actual PDF conversion, which downloads
# layout/table-structure model weights from Hugging Face on first use.
# That is a real network dependency (speed + flakiness risk) a sandboxed
# or offline CI runner should not have to pay on every default run, so
# these tests are excluded from `pytest -q` and must be run explicitly
# with `pytest -m docling_pdf` (see CONTRIBUTING.md). Every other
# supported document format (DOCX/PPTX/XLSX/HTML/Markdown/TXT/EML) is
# converted by Docling's rule-based backends and never touches this path,
# so it is exercised by the default suite like everything else.
#
# daemon_subprocess: spawns a real, detached OS process (`ragmonk daemon
# start`) and signals it (`daemon stop`). Slower and more platform-
# fragile than everything else in the suite (process startup time,
# signal delivery, PID reuse) the same way docling_pdf's model download
# is -- the daemon *loop*/debounce/reconciliation/offline-online logic
# it would otherwise gate is already fully covered by direct unit tests
# that never spawn a process (see CONTRIBUTING.md).
#
# benchmark_search: measures wall-clock search latency against a
# synthetic corpus (benchmarks/search/) and prints a report -- a
# diagnostic, not a correctness test, and its numbers are only
# meaningful on real, unshared hardware (see benchmarks/search/
# targets.py), so it is excluded from the default run the same way.
addopts = "-ra -m 'not docling_pdf and not daemon_subprocess and not embedding_model and not reranker_model and not benchmark_search and not cli_startup_benchmark'"
markers = [
    "docling_pdf: exercises Docling's real PDF conversion pipeline (network + model download on first run); excluded from the default run, see CONTRIBUTING.md",
    "daemon_subprocess: spawns and signals a real detached `ragmonk daemon` process; excluded from the default run, see CONTRIBUTING.md",
    "embedding_model: loads the real local embedding model (network + weight download on first run); excluded from the default run, see CONTRIBUTING.md",
    "reranker_model: loads the real local cross-encoder reranker model (network + weight download on first run); excluded from the default run, see CONTRIBUTING.md",
    "benchmark_search: measures search latency against a synthetic corpus (benchmarks/search/); excluded from the default run, see CONTRIBUTING.md",
    "cli_startup_benchmark: measures CLI subprocess startup latency (benchmarks/cli_startup/); excluded from the default run, see CONTRIBUTING.md",
]
