[package]
name = "ragmonk-convert"
description = "RagMonk Rust-native document conversion: docling.rs converter, normalizer and the V2 document processor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
docling = { version = "=1.89.0", default-features = false, features = ["pdf-text"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp"] }
lopdf = "0.44"
mail-parser = "0.11"
ocrs = "=0.12.0"
rten = { version = "0.24", default-features = false, features = ["rten_format"] }
sha2.workspace = true
ragmonk-code.workspace = true
ragmonk-config.workspace = true
ragmonk-core.workspace = true
ragmonk-documents.workspace = true
ragmonk-indexing.workspace = true
ragmonk-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
