[package]
name = "ragmonk-cli"
description = "RagMonk native CLI (Rust rewrite; RUST-00 skeleton, not yet a production replacement)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ragmonk"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
ragmonk-config.workspace = true
ragmonk-core.workspace = true
ragmonk-backends.workspace = true
ragmonk-convert.workspace = true
ragmonk-documents.workspace = true
ragmonk-indexing.workspace = true
ragmonk-storage.workspace = true
ragmonk-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
sysinfo.workspace = true
tempfile.workspace = true

[lints]
workspace = true
