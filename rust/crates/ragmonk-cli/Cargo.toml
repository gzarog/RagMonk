[package]
name = "ragmonk-cli"
description = "RagMonk native CLI (Rust rewrite; RUST-00 skeleton, not yet a production replacement)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ragmonk"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
ragmonk-ai.workspace = true
ragmonk-config.workspace = true
ragmonk-core.workspace = true
ragmonk-backends.workspace = true
ragmonk-convert.workspace = true
ragmonk-documents.workspace = true
ragmonk-indexing.workspace = true
ragmonk-knowledge.workspace = true
ragmonk-ml.workspace = true
ragmonk-retrieval.workspace = true
ragmonk-storage.workspace = true
ragmonk-telemetry.workspace = true
ragmonk-update.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tar.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
reqwest.workspace = true
regex.workspace = true
rusqlite.workspace = true
sysinfo.workspace = true
tempfile.workspace = true

[lints]
workspace = true
