# Golden query set for search quality regression testing (blueprint
# section 37; expanded under the Phase 0 search-quality-improvement
# baseline). Each entry generalizes the blueprint's own
# `expected`/`expected_paths`/`expected_documents` examples into one
# uniform `expected` list of {kind, path} pairs -- the relevant set a
# query's top results are scored against (Recall@1/3/5/10, MRR, NDCG@10;
# see benchmarks/search/quality.py and benchmarks/search_quality/
# evaluator.py).
#
# Evaluated against the fixture project built by
# benchmarks/search_quality/fixture_project.py's `write_project` (also
# used directly by tests/integration/test_search_quality.py) -- change
# one without the other and this file's paths/queries stop resolving to
# anything. Every entry below was verified against a real index of that
# fixture (real Tree-sitter + Docling parsing, no synthetic shortcuts)
# before being committed here; see that test file for how to re-verify.
#
# `category` is one of the search-quality plan's nine required buckets
# (exact_title_lookup, exact_heading_lookup, exact_symbol_lookup,
# keyword_search, semantic_document, table_question, cross_document,
# code_to_document, typo_partial_term) plus one extra this project's
# search already treats as its own signal, `file_path_lookup` (path/
# filename queries -- present in the original 8-query set as the
# "settlement_service.py" example, kept distinct from exact_symbol_lookup
# since it exercises `retrieval/lexical.py`'s PATH tier/`files_repo`
# path search rather than an identifier lookup).
#
# `expected` is deliberately not "whatever the current top-5 happens to
# contain": it is the reviewer's judgment of what genuinely answers each
# query given the fixture's content, so a query can and sometimes does
# have expected relevant items that rank below 5 today (e.g. a path hit
# crowded out by document FTS noise, or a document only reachable via a
# lower-tier signal) -- a real, non-trivial baseline number for later
# phases to improve on, not an artificially inflated one. Every single
# query is still required to score Recall@5 > 0 (see
# tests/integration/test_search_quality.py) -- a query with zero
# relevant hits anywhere in the top 5 would not be evidence of anything
# measurable.
#
# `typo_partial_term` is honestly scoped to what this system can
# currently do: FTS5's default tokenizer performs no fuzzy/edit-distance
# matching, so a genuine misspelling only still resolves when (a) it is
# a *fragment* that falls through to `files_repo.search_by_substring`'s
# LIKE fallback (mid-word, not token-aligned), or (b) it sits alongside
# other, correctly-spelled tokens in a multi-word query that the
# permissive OR-token FTS query still matches on. True spelling
# correction is out of scope for this phase and not something these
# queries pretend already works.

