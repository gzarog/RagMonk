- query: retry_worker.py
  category: file_path_lookup
  # The PATH-tier hit itself is crowded out of the top 5 here by FTS
  # entity/document noise sharing the "retry"/"worker" tokens -- a real,
  # documented gap (recall@5 partial, not full) rather than a query
  # rewritten to hide it.
  expected:
    - {kind: path, path: workers/retry_worker.py}
    - {kind: entity, path: workers/retry_worker.py}

